# Block for the server's main nginx (agentawk-nginx): agentawk.com and www.
# These exact names win over the app's "*.agentawk.com" wildcard block.
# Copy to /opt/agentawk/nginx/conf.d/ once the agentawk.com certificate exists.
server {
    listen 80;
    server_name agentawk.com www.agentawk.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://agentawk.com$request_uri;
    }
}

# www → apex
server {
    listen 443 ssl;
    http2 on;
    server_name www.agentawk.com;

    ssl_certificate     /etc/letsencrypt/live/agentawk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agentawk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://agentawk.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name agentawk.com;

    ssl_certificate     /etc/letsencrypt/live/agentawk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agentawk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Resolved through Docker's DNS at request time, so nginx still starts if
    # the website container is down.
    resolver 127.0.0.11 valid=30s;
    set $website http://website:80;

    location / {
        proxy_pass $website;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
